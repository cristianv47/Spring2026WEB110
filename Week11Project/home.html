<!DOCTYPE html>
<!--Cristian Villarreal 4/16/2026-->
<html lang="en-us">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Cristian Villareal">
        <meta name="description" content="Provides a Contact Us form">
        <link href="style.css" rel="stylesheet" type="text/css">
        <title>Contact Us</title>
    </head>

    <body>
        <h3>Contact Our Team</h3>
        <p>Please complete the form below and we'll get back to you as soon as possible.</p>
        
        <form action="https://webdevbasics.net/scripts/demo.php" method="post">
            <!--Creates text box input for full name-->
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>
            
            <!--Creates email input for email address-->
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <!--Creates phone input for phone number-->
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>

            <!--Creates dropdown input for topic with 3 different options-->
            <label for="topic">Topic:</label>
            <select id="topic" name="topic">
                <option value="general">General Inquiry</option>
                <option value="support">Support</option>
                <option value="feedback">Feedback</option>
            </select>

            <!--Creates textarea input for message-->
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required>
            </textarea>

            <!--Creates submit button to send form data-->
            <button type="submit">Send Message</button>
        </form>
     
        <footer>
            <a href="../index.html">Return to landing page</a>
        </footer>
    </body>
</html>
